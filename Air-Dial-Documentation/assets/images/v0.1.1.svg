3" fill="#123d34"/><circle cx="-20" cy="-41" r="3.3" fill="#123d34"/><circle cx="2" cy="0" r="3.3" fill="#123d34"/><circle cx="0" cy="-56" r="3.3" fill="#123d34"/><circle cx="18" cy="8" r="3.3" fill="#d5ddd1"/><circle cx="19" cy="-44" r="3.3" fill="#d5ddd1"/><circle cx="31" cy="24" r="3.3" fill="#123d34"/><circle cx="40" cy="-20" r="3.3" fill="#123d34"/></g><rect x="91" y="325" width="182" height="29" rx="14" fill="#d8ed98"/><text x="182.0" y="344" font-size="12" fill="#123d34" font-weight="600" text-anchor="middle">Live numeric outline</text><line x1="350" y1="220" x2="401" y2="220" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><rect x="426" y="125" width="259" height="74" rx="16" fill="#d8ed98"/><text x="447" y="154" font-size="17" fill="#123d34" font-weight="600" text-anchor="start">Visible joints</text><text x="447" y="179" font-size="14" fill="#123d34" font-weight="400" text-anchor="start">Evaluate the pose</text><rect x="426" y="214" width="259" height="74" rx="16" fill="#ffffff" stroke="#d5ddd1" stroke-width="1"/><text x="447" y="243" font-size="17" fill="#123d34" font-weight="600" text-anchor="start">Missing joints</text><text x="447" y="268" font-size="14" fill="#63786e" font-weight="400" text-anchor="start">Keep them unknown</text><text x="426" y="338" font-size="13" fill="#63786e" font-weight="400" text-anchor="start">No camera image in the guide</text></g></svg>