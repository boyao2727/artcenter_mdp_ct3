<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Hold to act. Protect the circle.</title><desc id="desc">A steady fist hold pauses after half a second and a thumb hold plays after half a second. Rotation blocks Pause during volume control and for two seconds afterward.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123d34"/></marker></defs><rect width="720" height="420" fill="#f5f5ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="11" fill="#63786e" font-weight="600" text-anchor="start">SOURCE-BASED DIAGRAM</text><text x="688" y="40" font-size="12" fill="#123d34" font-weight="600" text-anchor="end">v0.1.4</text><text x="32" y="79" font-size="25" fill="#123d34" font-weight="600" text-anchor="start">Hold to act. Protect the circle.</text><rect x="32" y="108" width="310" height="167" rx="16" fill="#ffffff"/><g transform="translate(99 166) scale(0.78)"><path d="M -27 35 L -30 7 Q -34 -2 -28 -10 Q -22 -18 -15 -13 L -13 -26 Q -5 -35 3 -26 Q 9 -35 17 -26 Q 24 -31 30 -21 L 34 10 Q 35 23 25 34 L 23 47 L -22 47 Z" fill="#d8ed98" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M -15 -13 L -10 10 M 3 -26 L 6 -1 M 17 -26 L 20 -1 M -27 7 Q -9 -4 0 15 L 9 22" fill="none" stroke="#123d34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="151" y="161" font-size="18" fill="#123d34" font-weight="600" text-anchor="start">Fist hold</text><text x="151" y="196" font-size="16" fill="#63786e" font-weight="400" text-anchor="start">0.5 s → Pause</text><rect x="362" y="108" width="326" height="167" rx="16" fill="#ffffff"/><g transform="translate(427 174) scale(0.78)"><path d="M -24 41 L -24 8 Q -23 0 -12 -6 L -2 -20 L -2 -45 Q 9 -53 14 -39 L 13 -10 L 31 -10 Q 39 -7 36 5 L 29 34 Q 27 42 14 42 Z" fill="#d8ed98" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="483" y="161" font-size="18" fill="#123d34" font-weight="600" text-anchor="start">Thumb hold</text><text x="483" y="196" font-size="16" fill="#63786e" font-weight="400" text-anchor="start">0.5 s → Play</text><text x="32" y="311" font-size="14" fill="#123d34" font-weight="600" text-anchor="start">Pause protection</text><rect x="32" y="329" width="340" height="25" rx="4" fill="#123d34"/><rect x="376" y="329" width="178" height="25" rx="4" fill="#d9824b"/><text x="202" y="347" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">During rotation</text><text x="465" y="347" font-size="12" fill="#123d34" font-weight="600" text-anchor="middle">2 seconds after</text><line x1="564" y1="341" x2="684" y2="341" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="386" font-size="14" fill="#63786e" font-weight="400" text-anchor="start">Release a drawing fist before a fresh Pause hold.</text></g></svg>