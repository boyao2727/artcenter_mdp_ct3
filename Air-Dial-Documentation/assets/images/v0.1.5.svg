<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Confirm rotation before volume</title><desc id="desc">Sustained valid rotation for one and a half seconds unlocks volume. Confirmation angles are discarded; only fresh angles after activation change volume.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123d34"/></marker></defs><rect width="720" height="420" fill="#f5f5ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="11" fill="#63786e" font-weight="600" text-anchor="start">SOURCE-BASED DIAGRAM</text><text x="688" y="40" font-size="12" fill="#123d34" font-weight="600" text-anchor="end">v0.1.5</text><text x="32" y="79" font-size="25" fill="#123d34" font-weight="600" text-anchor="start">Confirm rotation before volume</text><rect x="32" y="130" width="190" height="169" rx="16" fill="#ffffff"/><circle cx="127" cy="178" r="24" fill="#d8ed98"/><path d="M 115 178 L 115 164 A 12 12 0 0 1 139 164 L 139 178" fill="none" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="111" y="176" width="32" height="25" rx="5" fill="#123d34"/><text x="127" y="239" font-size="18" fill="#123d34" font-weight="600" text-anchor="middle">Locked</text><text x="127" y="265" font-size="13" fill="#63786e" font-weight="400" text-anchor="middle">Volume stays still</text><line x1="235" y1="212" x2="257" y2="212" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><rect x="267" y="130" width="190" height="169" rx="16" fill="#d8ed98"/><path d="M 334 176 A 30 30 0 1 1 334 201" fill="none" stroke="#123d34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="362" y="239" font-size="18" fill="#123d34" font-weight="600" text-anchor="middle">Confirming</text><text x="362" y="265" font-size="13" fill="#123d34" font-weight="400" text-anchor="middle">Rotate for 1.5 s</text><line x1="470" y1="212" x2="492" y2="212" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><rect x="502" y="130" width="186" height="169" rx="16" fill="#123d34"/><text x="595" y="202" font-size="21" fill="#d8ed98" font-weight="600" text-anchor="middle">45° → 1%</text><text x="595" y="239" font-size="18" fill="#ffffff" font-weight="600" text-anchor="middle">Unlocked</text><text x="595" y="265" font-size="13" fill="#ffffff" font-weight="400" text-anchor="middle">Fresh angles only</text><line x1="32" y1="336" x2="688" y2="336" stroke="#d5ddd1" stroke-width="2"/><text x="360" y="371" font-size="15" fill="#63786e" font-weight="400" text-anchor="middle">Confirmation angles are not replayed.</text></g></svg>