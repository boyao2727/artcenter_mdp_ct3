<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">A moving fist can pause</title><desc id="desc">A continuously recognized fist for a quarter of a second sends Pause. Hand translation no longer restarts the hold. Release is still required before a new Pause.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123d34"/></marker></defs><rect width="720" height="420" fill="#f5f5ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="11" fill="#63786e" font-weight="600" text-anchor="start">SOURCE-BASED DIAGRAM</text><text x="688" y="40" font-size="12" fill="#123d34" font-weight="600" text-anchor="end">v0.1.8</text><text x="32" y="79" font-size="25" fill="#123d34" font-weight="600" text-anchor="start">A moving fist can pause</text><path d="M 91 249 C 196 202 346 192 511 152" fill="none" stroke="#d5ddd1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8"/><g transform="translate(116 207) scale(0.78)"><path d="M -27 35 L -30 7 Q -34 -2 -28 -10 Q -22 -18 -15 -13 L -13 -26 Q -5 -35 3 -26 Q 9 -35 17 -26 Q 24 -31 30 -21 L 34 10 Q 35 23 25 34 L 23 47 L -22 47 Z" fill="#ffffff" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M -15 -13 L -10 10 M 3 -26 L 6 -1 M 17 -26 L 20 -1 M -27 7 Q -9 -4 0 15 L 9 22" fill="none" stroke="#123d34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(284 178) scale(0.78)"><path d="M -27 35 L -30 7 Q -34 -2 -28 -10 Q -22 -18 -15 -13 L -13 -26 Q -5 -35 3 -26 Q 9 -35 17 -26 Q 24 -31 30 -21 L 34 10 Q 35 23 25 34 L 23 47 L -22 47 Z" fill="#d8ed98" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M -15 -13 L -10 10 M 3 -26 L 6 -1 M 17 -26 L 20 -1 M -27 7 Q -9 -4 0 15 L 9 22" fill="none" stroke="#123d34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(456 137) scale(0.78)"><path d="M -27 35 L -30 7 Q -34 -2 -28 -10 Q -22 -18 -15 -13 L -13 -26 Q -5 -35 3 -26 Q 9 -35 17 -26 Q 24 -31 30 -21 L 34 10 Q 35 23 25 34 L 23 47 L -22 47 Z" fill="#d8ed98" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M -15 -13 L -10 10 M 3 -26 L 6 -1 M 17 -26 L 20 -1 M -27 7 Q -9 -4 0 15 L 9 22" fill="none" stroke="#123d34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="510" y1="173" x2="563" y2="173" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><rect x="586" y="141" width="13" height="62" rx="4" fill="#123d34"/><rect x="614" y="141" width="13" height="62" rx="4" fill="#123d34"/><text x="608" y="241" font-size="18" fill="#123d34" font-weight="600" text-anchor="middle">Pause</text><rect x="52" y="304" width="616" height="24" rx="12" fill="#d5ddd1"/><rect x="52" y="304" width="616" height="24" rx="12" fill="#123d34"/><text x="52" y="359" font-size="15" fill="#123d34" font-weight="600" text-anchor="start">Fist stays recognized</text><text x="668" y="359" font-size="22" fill="#123d34" font-weight="600" text-anchor="end">0.25 s</text><text x="52" y="388" font-size="14" fill="#63786e" font-weight="400" text-anchor="start">Movement is allowed. Release before the next Pause.</text></g></svg>