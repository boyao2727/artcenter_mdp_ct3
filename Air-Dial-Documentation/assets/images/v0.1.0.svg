<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">A hand becomes a control</title><desc id="desc">A full circle changes system volume by five percentage points. Palm swipes change tracks, a fist after an open palm pauses, and a raised thumb plays.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123d34"/></marker></defs><rect width="720" height="420" fill="#f5f5ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="11" fill="#63786e" font-weight="600" text-anchor="start">SOURCE-BASED DIAGRAM</text><text x="688" y="40" font-size="12" fill="#123d34" font-weight="600" text-anchor="end">v0.1.0</text><text x="32" y="79" font-size="25" fill="#123d34" font-weight="600" text-anchor="start">A hand becomes a control</text><circle cx="185" cy="196" r="73" fill="#d8ed98"/><path d="M 137 156 A 62 62 0 1 1 128 221" fill="none" stroke="#123d34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(186 183) scale(0.58)"><path d="M 0 65 L -22 42 L -35 12 L -39 -10" fill="none" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 0 65 L -14 6 L -20 -41" fill="none" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 0 65 L 2 0 L 0 -56" fill="none" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 0 65 L 18 8 L 19 -44" fill="none" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 0 65 L 31 24 L 40 -20" fill="none" stroke="#123d34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="65" r="3.3" fill="#123d34"/><circle cx="-22" cy="42" r="3.3" fill="#123d34"/><circle cx="-35" cy="12" r="3.3" fill="#123d34"/><circle cx="-39" cy="-10" r="3.3" fill="#123d34"/><circle cx="-14" cy="6" r="3.3" fill="#123d34"/><circle cx="-20" cy="-41" r="3.3" fill="#123d34"/><circle cx="2" cy="0" r="3.3" fill="#123d34"/><circle cx="0" cy="-56" r="3.3" fill="#123d34"/><circle cx="18" cy="8" r="3.3" fill="#123d34"/><circle cx="19" cy="-44" r="3.3" fill="#123d34"/><circle cx="31" cy="24" r="3.3" fill="#123d34"/><circle cx="40" cy="-20" r="3.3" fill="#123d34"/></g><text x="185" y="299" font-size="15" fill="#123d34" font-weight="600" text-anchor="middle">One full circle</text><line x1="280" y1="197" x2="338" y2="197" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><text x="387" y="202" font-size="60" fill="#123d34" font-weight="600" text-anchor="start">5%</text><text x="389" y="230" font-size="15" fill="#63786e" font-weight="400" text-anchor="start">volume step</text><line x1="32" y1="326" x2="688" y2="326" stroke="#d5ddd1" stroke-width="2"/><text x="48" y="363" font-size="14" fill="#123d34" font-weight="600" text-anchor="start">Swipe</text><text x="48" y="385" font-size="13" fill="#63786e" font-weight="400" text-anchor="start">Next / Previous</text><text x="266" y="363" font-size="14" fill="#123d34" font-weight="600" text-anchor="start">Open palm → Fist</text><text x="266" y="385" font-size="13" fill="#63786e" font-weight="400" text-anchor="start">Pause</text><text x="524" y="363" font-size="14" fill="#123d34" font-weight="600" text-anchor="start">Thumb up</text><text x="524" y="385" font-size="13" fill="#63786e" font-weight="400" text-anchor="start">Play</text></g></svg>