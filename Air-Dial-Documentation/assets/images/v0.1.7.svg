<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Keep preparation running</title><desc id="desc">Volume preparation is tested across four to thirty frames per second. A process activity supports the running camera session independently of the guide window.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123d34"/></marker></defs><rect width="720" height="420" fill="#f5f5ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="11" fill="#63786e" font-weight="600" text-anchor="start">SOURCE-BASED DIAGRAM</text><text x="688" y="40" font-size="12" fill="#123d34" font-weight="600" text-anchor="end">v0.1.7</text><text x="32" y="79" font-size="25" fill="#123d34" font-weight="600" text-anchor="start">Keep preparation running</text><rect x="32" y="113" width="656" height="138" rx="16" fill="#ffffff"/><text x="54" y="145" font-size="15" fill="#123d34" font-weight="600" text-anchor="start">Observed movement</text><line x1="63" y1="196" x2="636" y2="196" stroke="#d5ddd1" stroke-width="3"/><circle cx="65" cy="196" r="6" fill="#123d34"/><circle cx="115" cy="196" r="6" fill="#123d34"/><circle cx="181" cy="196" r="6" fill="#123d34"/><circle cx="266" cy="196" r="6" fill="#123d34"/><circle cx="315" cy="196" r="6" fill="#123d34"/><circle cx="405" cy="196" r="6" fill="#123d34"/><circle cx="453" cy="196" r="6" fill="#123d34"/><circle cx="504" cy="196" r="6" fill="#123d34"/><circle cx="563" cy="196" r="6" fill="#123d34"/><circle cx="631" cy="196" r="6" fill="#123d34"/><text x="54" y="231" font-size="13" fill="#63786e" font-weight="400" text-anchor="start">4–30 fps checks</text><text x="660" y="231" font-size="13" fill="#123d34" font-weight="600" text-anchor="end">1.5 s preparation</text><rect x="32" y="279" width="220" height="95" rx="16" fill="#ffffff" stroke="#d5ddd1" stroke-width="1"/><text x="142" y="317" font-size="18" fill="#63786e" font-weight="600" text-anchor="middle">Guide closed</text><text x="142" y="344" font-size="13" fill="#63786e" font-weight="400" text-anchor="middle">The window can close</text><line x1="273" y1="326" x2="331" y2="326" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><rect x="353" y="279" width="335" height="95" rx="16" fill="#d8ed98"/><circle cx="380" cy="310" r="5" fill="#123d34"/><text x="400" y="316" font-size="18" fill="#123d34" font-weight="600" text-anchor="start">Camera session active</text><text x="376" y="344" font-size="13" fill="#123d34" font-weight="400" text-anchor="start">Process activity supports gesture work</text></g></svg>