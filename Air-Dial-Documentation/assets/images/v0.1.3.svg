<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Small arcs, continuous volume</title><desc id="desc">About forty-five degrees of valid rotation changes volume by one percentage point. Wrist, index knuckle and little knuckle feed one shared angle stream.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123d34"/></marker></defs><rect width="720" height="420" fill="#f5f5ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="11" fill="#63786e" font-weight="600" text-anchor="start">SOURCE-BASED DIAGRAM</text><text x="688" y="40" font-size="12" fill="#123d34" font-weight="600" text-anchor="end">v0.1.3</text><text x="32" y="79" font-size="25" fill="#123d34" font-weight="600" text-anchor="start">Small arcs, continuous volume</text><circle cx="170" cy="220" r="93" fill="#d8ed98"/><path d="M 170 220 L 252 173 A 94 94 0 0 1 261 244 Z" fill="#d9824b" stroke="#d9824b" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M 252 173 A 94 94 0 0 1 261 244" fill="none" stroke="#123d34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="170" y1="220" x2="252" y2="173" stroke="#123d34" stroke-width="1"/><line x1="170" y1="220" x2="261" y2="244" stroke="#123d34" stroke-width="1"/><text x="165" y="224" font-size="27" fill="#123d34" font-weight="600" text-anchor="middle">45°</text><text x="170" y="349" font-size="14" fill="#63786e" font-weight="400" text-anchor="middle">No closed circle needed</text><text x="359" y="163" font-size="16" fill="#123d34" font-weight="400" text-anchor="start">Wrist</text><text x="359" y="205" font-size="16" fill="#123d34" font-weight="400" text-anchor="start">Index knuckle</text><text x="359" y="247" font-size="16" fill="#123d34" font-weight="400" text-anchor="start">Little knuckle</text><circle cx="336" cy="157" r="5" fill="#d9824b"/><circle cx="336" cy="199" r="5" fill="#123d34"/><circle cx="336" cy="241" r="5" fill="#123d34"/><line x1="491" y1="160" x2="529" y2="200" stroke="#63786e" stroke-width="1"/><line x1="491" y1="202" x2="529" y2="200" stroke="#63786e" stroke-width="1"/><line x1="491" y1="244" x2="529" y2="200" stroke="#63786e" stroke-width="1"/><line x1="530" y1="200" x2="557" y2="200" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><text x="575" y="210" font-size="40" fill="#123d34" font-weight="600" text-anchor="start">1%</text><text x="530" y="285" font-size="14" fill="#63786e" font-weight="400" text-anchor="middle">One shared angle stream</text></g></svg>