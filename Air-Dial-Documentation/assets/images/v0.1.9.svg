<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Show the real volume result</title><desc id="desc">A successful gesture volume write requests the native macOS volume HUD with the actual resulting level. This is a source-based dispatch schematic, not an image of the system HUD.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123d34"/></marker></defs><rect width="720" height="420" fill="#f5f5ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="11" fill="#63786e" font-weight="600" text-anchor="start">SOURCE-BASED DIAGRAM</text><text x="688" y="40" font-size="12" fill="#123d34" font-weight="600" text-anchor="end">v0.1.9</text><text x="32" y="79" font-size="25" fill="#123d34" font-weight="600" text-anchor="start">Show the real volume result</text><rect x="32" y="145" width="177" height="132" rx="16" fill="#ffffff"/><text x="120" y="184" font-size="18" fill="#123d34" font-weight="600" text-anchor="middle">Gesture</text><text x="120" y="213" font-size="18" fill="#123d34" font-weight="600" text-anchor="middle">volume step</text><rect x="64" y="235" width="112" height="29" rx="14" fill="#d8ed98"/><text x="120.0" y="254" font-size="12" fill="#123d34" font-weight="600" text-anchor="middle">Valid arc</text><line x1="220" y1="211" x2="249" y2="211" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><rect x="261" y="145" width="188" height="132" rx="16" fill="#d8ed98"/><text x="355" y="184" font-size="18" fill="#123d34" font-weight="600" text-anchor="middle">Volume write</text><path d="M 332 221 L 347 235 L 377 204" fill="none" stroke="#123d34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="355" y="260" font-size="13" fill="#123d34" font-weight="600" text-anchor="middle">Success</text><line x1="461" y1="211" x2="490" y2="211" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><rect x="501" y="145" width="187" height="132" rx="16" fill="#123d34"/><text x="595" y="186" font-size="17" fill="#ffffff" font-weight="600" text-anchor="middle">Native macOS</text><text x="595" y="212" font-size="17" fill="#ffffff" font-weight="600" text-anchor="middle">volume HUD</text><text x="595" y="252" font-size="12" fill="#d8ed98" font-weight="400" text-anchor="middle">Actual resulting level</text><line x1="32" y1="315" x2="688" y2="315" stroke="#d5ddd1" stroke-width="2"/><text x="32" y="350" font-size="14" fill="#123d34" font-weight="600" text-anchor="start">Dispatch schematic</text><text x="32" y="378" font-size="14" fill="#63786e" font-weight="400" text-anchor="start">System appearance depends on macOS.</text></g></svg>