<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Move first. Circle next.</title><desc id="desc">One and a half seconds of visible hand activity prepares volume control. Straight movement can prepare it, but only a valid arc after unlock changes volume.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#123d34"/></marker></defs><rect width="720" height="420" fill="#f5f5ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="11" fill="#63786e" font-weight="600" text-anchor="start">SOURCE-BASED DIAGRAM</text><text x="688" y="40" font-size="12" fill="#123d34" font-weight="600" text-anchor="end">v0.1.6</text><text x="32" y="79" font-size="25" fill="#123d34" font-weight="600" text-anchor="start">Move first. Circle next.</text><rect x="32" y="111" width="125" height="29" rx="14" fill="#d8ed98"/><text x="94.5" y="130" font-size="12" fill="#123d34" font-weight="600" text-anchor="middle">1 · PREPARE</text><path d="M 62 232 C 95 158 122 282 160 206 S 225 196 276 220" fill="none" stroke="#123d34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="62" cy="232" r="5" fill="#d9824b"/><text x="166" y="304" font-size="17" fill="#123d34" font-weight="600" text-anchor="middle">1.5 s of hand movement</text><text x="166" y="330" font-size="14" fill="#63786e" font-weight="400" text-anchor="middle">Straight paths also count</text><line x1="318" y1="225" x2="391" y2="225" stroke="#123d34" stroke-width="2" marker-end="url(#arrow)"/><rect x="430" y="111" width="122" height="29" rx="14" fill="#d8ed98"/><text x="491.0" y="130" font-size="12" fill="#123d34" font-weight="600" text-anchor="middle">2 · ADJUST</text><circle cx="544" cy="222" r="62" fill="#d8ed98"/><path d="M 507 178 A 60 60 0 0 1 601 239" fill="none" stroke="#123d34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="544" y="304" font-size="17" fill="#123d34" font-weight="600" text-anchor="middle">A new, valid arc</text><text x="544" y="330" font-size="14" fill="#63786e" font-weight="400" text-anchor="middle">45° → 1% volume</text><text x="360" y="388" font-size="14" fill="#63786e" font-weight="400" text-anchor="middle">Preparation movement never changes volume.</text></g></svg>